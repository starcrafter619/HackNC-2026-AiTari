<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Study Buddy</title>
</head>
<body>
  <h2>Pomodoro Timer</h2>
  <input id="minutes" type="number" value="25" min="1" /> minutes
  <button id="startBtn">Start</button>
  <div id="timer" style="font-size: 2rem;">25:00</div>

  <h2>Your Notes</h2>
  <textarea id="notes" rows="8" cols="60" placeholder="Paste your study notes here..."></textarea>

  <h2>Chat</h2>
  <div id="chat" style="border:1px solid #ccc; height:250px; overflow-y:auto; padding:8px;"></div>
  <input id="message" placeholder="Ask about your notes..." size="50" />
  <button id="sendBtn">Send</button>

  <script src="script.js"></script>
</body>
</html>
